<!DOCTYPE html>
<html lang="es">
<head>

</head>
<body>

    <div class="container">
        <!-- Título principal basado en el Capítulo 9 -->
        <h2>Capítulo IX: El Enigma del Astrólogo</h2>
        <p>Calcular el año de nacimiento y verificar la edad de acuerdo con los cálculos del libro[span_3](start_span)[span_3](end_span).</p>
        
        <!-- Formulario básico -->
        <form id="capituloForm">

                <label for="valEdad">Edad de la persona:</label>

            <button type="button" onclick="resolverProblema()">Calcular Año</button>
